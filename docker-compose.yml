services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: checkin_db
      MYSQL_USER: checkin_app
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      DB_DSN: "checkin_app:${MYSQL_PASSWORD}@tcp(db:3306)/checkin_db?parseTime=true&charset=utf8mb4&loc=UTC"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      LISTEN_ADDR: 0.0.0.0:8080
      DINGTALK_CLIENT_ID: "${DINGTALK_CLIENT_ID:-}"
      DINGTALK_CLIENT_SECRET: "${DINGTALK_CLIENT_SECRET:-}"
      DINGTALK_ACCESS_TOKEN: "${DINGTALK_ACCESS_TOKEN:-}"
      DINGTALK_DEVICE_NAME: "${DINGTALK_DEVICE_NAME:-外部系统同步}"
      DINGTALK_DEVICE_ID: "${DINGTALK_DEVICE_ID:-manual_sync_001}"
      DINGTALK_UPLOAD_FORMAT: "${DINGTALK_UPLOAD_FORMAT:-form}"
      DINGTALK_SYNC_USERS_ON_START: "${DINGTALK_SYNC_USERS_ON_START:-true}"
      DINGTALK_ROOT_DEPT_ID: "${DINGTALK_ROOT_DEPT_ID:-1}"
      DINGTALK_PROXY_URL: "${DINGTALK_PROXY_URL:-}"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql_data:
